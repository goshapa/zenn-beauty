<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenn — Zenn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --fg:#f5f5f5; --fg-soft:#9a9a9a; --accent:#2f6fed; --accent-on:#ffffff;
  --line:color-mix(in srgb, var(--fg) 12%, transparent);
  --card-bg:color-mix(in srgb, var(--fg) 6%, var(--bg));
  --font-display:'Bebas Neue',sans-serif; --font-body:Barlow,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); margin:0; font-family:var(--font-body); overflow-x:hidden;}
a{color:inherit; text-decoration:none}
svg{display:block}

.icon-btn{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent); color:var(--accent-on); flex:0 0 auto; }
.icon-btn svg{ width:18px; height:18px; }

.lang-switch{ display:flex; border:1.5px solid var(--accent); border-radius:999px; overflow:hidden; flex:0 0 auto; }
.lang-switch button{ border:none; background:transparent; color:var(--fg-soft); font:600 11px/1 var(--font-body); padding:8px 10px; cursor:pointer; }
.lang-switch button.active{ background:var(--accent); color:var(--accent-on); }

.topbar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(6px); }
.logo{ font-family:var(--font-display); font-size:20px; color:var(--fg); display:flex; align-items:center; gap:6px; letter-spacing:.02em; }
.logo b{ color:var(--accent); font-weight:400; }
.topbar-right{ display:flex; align-items:center; gap:10px; }
.burger{ width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-on); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.burger svg{ width:16px; height:16px; }

.menu-panel{ position:fixed; inset:0; z-index:40; background:var(--bg); transform:translateX(100%); transition:transform .35s ease; overflow-y:auto; }
.menu-panel.open{ transform:translateX(0); }
.menu-inner{ max-width:420px; margin:0 auto; padding:20px; }
.menu-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:36px; }
.menu-links{ display:flex; flex-direction:column; gap:22px; margin-bottom:40px; }
.menu-links a{ font-family:var(--font-display); font-size:24px; color:var(--fg); }
.menu-contact{ font:400 15px/1.9 var(--font-body); color:var(--fg-soft); margin-bottom:24px; }
.menu-contact a{ color:var(--fg); }
.menu-social{ display:flex; align-items:center; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
.menu-cta{ display:inline-block; padding:16px 28px; border-radius:999px; border:1.5px solid var(--accent); color:var(--fg); font:500 14px/1 var(--font-body); }

.hero{ max-width:1040px; margin:0 auto; padding:8px 20px 60px; display:grid; grid-template-columns:1fr 1fr; gap:8px 40px; align-items:center; }
@media (max-width:760px){ .hero{ grid-template-columns:1fr; } }
.h1{ font-family:var(--font-display); font-weight:400; font-size:clamp(34px,6vw,50px); line-height:1.05; color:var(--fg); margin:0 0 28px; text-transform:uppercase; }
.oval-wrap{ position:relative; }
.oval-ph{ aspect-ratio:5/4; border-radius:50%; transform:rotate(-6deg) scale(1.15); background:color-mix(in srgb, var(--accent) 22%, var(--bg)); border:1px solid var(--accent); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.oval-ph svg{ width:15%; height:15%; color:var(--accent); transform:rotate(6deg); }
.brand-mark{ margin-top:22px; text-align:right; }
.brand-mark .b1{ font-family:var(--font-display); font-size:32px; color:var(--accent); }
.brand-mark .b2{ font-family:var(--font-display); font-size:24px; color:var(--fg); margin-top:-2px; }
.tagline{ margin-top:26px; font-family:var(--font-display); font-size:18px; color:var(--fg-soft); line-height:1.5; }
.tagline .drop{ font-family:var(--font-display); font-size:48px; color:var(--accent); float:left; line-height:.8; margin:4px 8px 0 0; }
.hero-ctas{ margin-top:30px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.circle-cta{ width:124px; height:124px; border-radius:50%; background:var(--accent); color:var(--accent-on); display:flex; align-items:center; justify-content:center; text-align:center; font:600 14px/1.3 var(--font-body); letter-spacing:.02em; flex:0 0 auto; }
.badge-circle{ width:94px; height:94px; border-radius:50%; border:1.5px dashed var(--accent); display:flex; align-items:center; justify-content:center; text-align:center; font:500 11px/1.3 var(--font-body); color:var(--fg-soft); padding:8px; flex:0 0 auto; }
.ghost-pill{ padding:15px 26px; border-radius:999px; border:1.5px solid var(--accent); color:var(--fg); font:500 14px/1 var(--font-body); }

.float-btn{ position:fixed; bottom:22px; z-index:20; width:100px; height:100px; border-radius:50%; background:var(--accent); color:var(--accent-on); display:flex; align-items:center; justify-content:center; text-align:center; font:600 13px/1.25 var(--font-body); box-shadow:0 6px 20px color-mix(in srgb, var(--fg) 25%, transparent); }
.float-btn.right{ right:22px; }
.float-btn.left{ left:22px; background:transparent; border:1.5px solid var(--accent); color:var(--fg); box-shadow:none; }
@media (max-width:480px){ .float-btn{ width:82px; height:82px; font-size:12px; } }

.section{ max-width:1040px; margin:0 auto; padding:64px 20px; }
.section-head{ text-align:center; margin-bottom:38px; }
.section-head h2{ font-family:var(--font-display); font-weight:400; font-size:28px; color:var(--fg); margin:0 0 8px; text-transform:uppercase; }
.section-head p{ font:400 14px/1.6 var(--font-body); color:var(--fg-soft); margin:0; }

.svc-scroll{ display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
.svc-scroll::-webkit-scrollbar{ display:none; }
.svc-card{ flex:0 0 auto; width:250px; background:var(--card-bg); border-radius:18px; padding:26px 24px; border:1px solid var(--line); }
.svc-card h3{ font-family:var(--font-display); font-weight:400; font-size:19px; color:var(--fg); margin:0 0 14px; }
.svc-card p.d{ font:400 13px/1.5 var(--font-body); color:var(--fg-soft); margin:0 0 18px; min-height:38px; }
.svc-card .price{ font:500 12px/1 var(--font-body); color:var(--fg-soft); margin:0 0 16px; }
.svc-book{ display:inline-block; width:100%; text-align:center; padding:13px; border-radius:999px; background:var(--accent); color:var(--accent-on); font:600 13px/1 var(--font-body); letter-spacing:.02em; }

.gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media (max-width:560px){ .gallery{ grid-template-columns:repeat(2,1fr); } }
.gph{ aspect-ratio:1/1; border-radius:16px; background:color-mix(in srgb, var(--accent) 18%, var(--bg)); border:1px solid var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent); }
.gph svg{ width:24%; height:24%; }

.inside{ display:flex; flex-direction:column; align-items:center; text-align:center; }
.inside-circle{ width:260px; height:260px; max-width:70vw; aspect-ratio:1/1; border-radius:50%; background:color-mix(in srgb, var(--accent) 20%, var(--bg)); border:1px solid var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent); margin-bottom:24px; }
.inside-circle svg{ width:22%; height:22%; }
.inside-script{ font-family:var(--font-display); font-style:italic; font-size:21px; color:var(--accent); }

.team-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:18px; }
.team-card{ text-align:center; }
.team-avatar{ width:60px; height:60px; margin:0 auto 10px; border-radius:50%; background:color-mix(in srgb, var(--accent) 25%, var(--bg)); color:var(--accent); display:flex; align-items:center; justify-content:center; font:500 19px/1 var(--font-display); }
.team-name{ font:500 14px/1.3 var(--font-body); color:var(--fg); margin:0 0 2px; }
.team-role{ font:400 12px/1.3 var(--font-body); color:var(--fg-soft); margin:0; }

.values{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
@media (max-width:680px){ .values{ grid-template-columns:1fr; } }
.value{ text-align:center; }
.value-icon{ width:54px; height:54px; border-radius:50%; background:color-mix(in srgb, var(--accent) 20%, var(--bg)); color:var(--fg); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.value-icon svg{ width:22px; height:22px; }
.value h3{ font-family:var(--font-display); font-weight:400; font-size:17px; color:var(--fg); margin:0 0 8px; }
.value p{ font:400 13px/1.6 var(--font-body); color:var(--fg-soft); margin:0; }

.contact-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start; }
@media (max-width:680px){ .contact-wrap{ grid-template-columns:1fr; } }
.contact-list{ display:flex; flex-direction:column; gap:0; }
.contact-row{ display:flex; justify-content:space-between; gap:12px; padding:16px 0; border-top:1px solid var(--line); flex-wrap:wrap; font:400 15px/1.6 var(--font-body); }
.contact-row span:first-child{ color:var(--fg-soft); }
.contact-row a{ color:var(--fg); border-bottom:1px solid var(--accent); }
.form-box{ background:var(--card-bg); border-radius:18px; padding:28px; border:1px solid var(--line); }
.form-box h3{ font-family:var(--font-display); font-weight:400; font-size:19px; color:var(--fg); margin:0 0 18px; }
.field{ width:100%; border:none; border-bottom:1px solid var(--line); background:transparent; padding:10px 0; font:400 15px/1.5 var(--font-body); color:var(--fg); margin-bottom:22px; }
.field:focus{ outline:none; border-color:var(--accent); }
.field::placeholder{ color:var(--fg-soft); }
.submit-btn{ width:100%; padding:15px; border-radius:999px; border:1.5px solid var(--accent); background:transparent; color:var(--fg); font:500 14px/1 var(--font-body); cursor:pointer; }

.foot{ border-top:1px solid var(--line); padding:32px 20px 100px; text-align:center; display:flex; flex-direction:column; gap:10px; }
.foot-links{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }
.foot-links a{ font:400 12px/1 var(--font-body); color:var(--fg-soft); }
.foot small{ font:400 12px/1.5 var(--font-body); color:var(--fg-soft); opacity:.7; }

.popup-overlay{ position:fixed; inset:0; z-index:50; background:#0a0a0acc; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .3s ease; }
.popup-overlay.open{ opacity:1; pointer-events:auto; }
.popup-card{ background:var(--bg); border-radius:20px; max-width:380px; width:100%; padding:40px 32px 32px; position:relative; text-align:center; }
.popup-close{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; border:none; background:transparent; color:var(--fg-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.popup-close svg{ width:18px; height:18px; }
.popup-card h3{ font-family:var(--font-display); font-weight:400; font-size:23px; color:var(--fg); text-transform:uppercase; margin:0 0 14px; }
.popup-card p{ font:400 14px/1.6 var(--font-body); color:var(--fg-soft); margin:0 0 24px; }
.popup-card .field{ text-align:left; }
</style>
</head>

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(I18N[lang] && I18N[lang][key] !== undefined) el.innerHTML = I18N[lang][key];

    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  try{ localStorage.setItem(langKey, lang); }catch(e){}
}
document.querySelectorAll('[data-lang-switch] button').forEach(btn=>{

});
